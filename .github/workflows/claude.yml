name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Actions are pinned to full commit SHAs, not major tags. A major tag is a
      # movable pointer that its maintainer re-points on every release, so `@v1`
      # changes the code running here with no diff, no PR and no review in this
      # repository - the tj-actions/changed-files compromise re-pointed every
      # version tag at a commit that dumped CI secrets into build logs. This job
      # is the one that matters: it passes `CLAUDE_CODE_OAUTH_TOKEN` straight to
      # the action below and holds `id-token: write`. `claude-code-review.yml`
      # already pins the same action by SHA and #381 pinned the review plugin's
      # marketplace behind it; leaving the other consumer of that credential on a
      # floating tag was the remaining gap in the same chain. Dependabot advances
      # these (see `.github/dependabot.yml`), which is only worth anything if the
      # SHA it moves to gets looked at.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # `@claude review this PR` is the manual review. A mention gives Claude the PR's
          # file list but not its patch, and allows no `gh` commands by default, so a
          # review could only read whole files and guess what changed. These two are
          # read-only and let it read the real diff. They add to the action's own tools.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*)"'


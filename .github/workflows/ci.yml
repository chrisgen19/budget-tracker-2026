name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The job only reads the repo and runs checks. Pinned here rather than relying on the
    # repository default, which is set outside the repo and can change without a diff --
    # this workflow runs install scripts and test code, so the token it holds matters.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the "packageManager" field in package.json.
      # It must stay >=10.16 so the .npmrc hardening (minimum-release-age,
      # block-exotic-subdeps) is actually enforced here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --engine-strict fails the install when any dependency's engines.node excludes the
      # Node version above, instead of letting it surface later as an obscure crash inside
      # a test worker. jsdom 30 and @testing-library/jest-dom 7 both floor at Node 22 and
      # were caught this way.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm type-check

      # `next build` is the only thing in this pipeline that validates a page module's exports,
      # and nothing here ran it until #337. #332 exported a component from
      # src/app/(app)/analytics/page.tsx so a test could reach it; `next typegen` and
      # `tsc --noEmit` both accept that, and the deploy then failed with
      # `"AnalyticsTabBar" is not a valid Page export field`. Two merges reached main green and
      # left production building the previous image for 22 minutes. The build is also the only
      # check here that exercises the serwist service-worker bundling and route collection.
      #
      # `pnpm build`, never `pnpm build:deploy`. That one runs `prisma migrate deploy`, and the
      # whole of #192 is that migrating must never live behind a name a CI provider might call by
      # convention. `scripts/build-scripts.test.ts` asserts that split, and this step is the
      # reason it has to keep asserting it.
      #
      # GEMINI_API_KEY here is a placeholder and not a secret. `src/lib/gemini.ts` constructs
      # `GoogleGenAI` at module scope, so collecting page data for /api/assessment/daily-tip
      # throws "API key must be set when using the Gemini API" without one; nothing calls Gemini
      # during a build. Measured against a clean environment with no `.env`: this is the *only*
      # variable the build needs -- not DATABASE_URL, not NEXTAUTH_SECRET. Lazily constructing
      # that client would remove even this, and is its own change.
      #
      # Deliberately no `.next/cache` restore, against the Next.js CI guidance, because the
      # numbers here do not support it: measured on this repo a cold build is 94s and a warm one
      # 63s, while `.next/cache` is 564MB. Moving that much through the Actions cache costs more
      # wall clock than the 31s it saves, and it would crowd the shared 10GB budget that
      # setup-node's pnpm store already draws on. Worth revisiting if the build grows.
      - name: Build
        run: pnpm build
        env:
          GEMINI_API_KEY: ci-build-placeholder-not-a-real-key

      - name: Test
        run: pnpm test

      # mcp-server is a standalone package: its own lockfile, its own .npmrc, and excluded
      # from the root tsconfig. Nothing above this step enters the directory, so the file
      # wiring the 8 MCP tools to src/lib/budget-queries.ts had no static verification at
      # all -- and it drifted, silently, for five months. It must run after the root
      # install, whose postinstall generates the Prisma client that this package links to.
      - name: Install MCP server dependencies
        run: pnpm install --frozen-lockfile --engine-strict
        working-directory: mcp-server

      - name: Type check MCP server
        run: pnpm type-check
        working-directory: mcp-server

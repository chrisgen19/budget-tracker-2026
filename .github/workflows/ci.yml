name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The job only reads the repo and runs checks. Pinned here rather than relying on the
    # repository default, which is set outside the repo and can change without a diff --
    # this workflow runs install scripts and test code, so the token it holds matters.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the "packageManager" field in package.json.
      # It must stay >=10.16 so the .npmrc hardening (minimum-release-age,
      # block-exotic-subdeps) is actually enforced here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

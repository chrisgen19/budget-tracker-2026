name: Claude Code Review

on:
  pull_request:
    # One automated review per PR: when it is opened, or when a draft is
    # marked ready. Deliberately no `synchronize` - that re-reviews on every
    # push. Comment `@claude review this` (claude.yml) to ask for another.
    types: [opened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # A PR opened as a draft still fires `opened`, so skip it and wait for
    # `ready_for_review` instead.
    if: github.event.pull_request.draft == false

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write`, not `read`: posting an inline comment is a write. With `read` the
      # job ran green and silently posted nothing - see the claude_args note below.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # This list must mirror the `allowed-tools:` frontmatter of the plugin's own
          # command (anthropics/claude-code, plugins/code-review/commands/code-review.md).
          # `claude_args` narrows the set rather than adding to it, so listing only the
          # inline-comment tool left the review with no way to read the PR: step 1 of the
          # command runs `gh pr view --comments`, that call was denied, and the command's
          # "stop and do not proceed" branch ended the run in 21s having posted nothing.
          # The job still reported success, because a denied tool is not an error. It also
          # could not fall back to the "no issues found" summary, which needs `gh pr comment`.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

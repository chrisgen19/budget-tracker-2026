name: Bill Reminders Cron

# Triggers the /api/cron/bill-reminders endpoint on production daily.
# Production runs on Coolify, which does not read vercel.json, so scheduling
# is handled here. Also supports manual runs via workflow_dispatch.
#
# Required repo settings:
#   - Secrets > CRON_SECRET   — must match the value set in the production environment
#   - Variables > CRON_URL    — production base URL (e.g., https://budget.cgdev.site)

on:
  schedule:
    # Daily at 08:00 UTC (16:00 Philippine Time)
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call bill-reminders endpoint
        env:
          CRON_URL: ${{ vars.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_URL:-}" ]; then
            echo "::error::CRON_URL repo variable is not set"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi

          http_code=$(curl \
            --silent \
            --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --max-time 120 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_URL}/api/cron/bill-reminders")

          echo "HTTP ${http_code}"
          cat response.json || true
          echo

          if [ "${http_code}" != "200" ]; then
            echo "::error::Bill reminders cron failed with HTTP ${http_code}"
            exit 1
          fi
